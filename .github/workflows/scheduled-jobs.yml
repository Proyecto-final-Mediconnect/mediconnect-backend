name: Scheduled Jobs (respaldo)

# RESPALDO del scheduler. El principal es pg_cron en Supabase
# (`scripts/scheduler/pg-cron.sql`, ENG-228), que dispara cada minuto. Este
# workflow quedó porque no cuesta nada y cubre el caso de que pg_cron se caiga,
# pero NO es confiable por sí solo: el 17/11 GitHub lo corrió 3 veces en el día
# en lugar de cada 5 minutos. Por eso pasó de */5 a */30.
#
# Que coincida con pg_cron no rompe nada: los endpoints son idempotentes y el
# backend no deja correr dos veces el mismo job a la vez (`job_runs`).
#
# Tareas (fuente única: `src/jobs/jobs.config.ts`):
# - release-unpaid-appointments (ENG-101): libera los turnos que no se pagaron
#   en 15 minutos.
# - send-appointment-reminders (ENG-68): confirmaciones pendientes y
#   recordatorios a 24 h y a 1 h por email.
# - close-expired-medipass-sessions (ENG-104): deja escrito el cierre de los
#   accesos al MediPass que vencieron (30 min) o se cortaron.
# - close-finished-appointments (ENG-189): cierra los turnos confirmados cuya
#   sala ya cerró.
# - send-review-requests (ENG-190): un mail por turno pidiendo la reseña, 3 h
#   después de que cierra la sala.
#
# Secrets que necesita (Settings → Secrets and variables → Actions):
#   - RENDER_BACKEND_URL  el mismo que usa keepalive.yml.
#   - JOBS_SECRET         igual al JOBS_SECRET de Render (mínimo 32 caracteres).
#
# El cron de GitHub se deshabilita solo tras 60 días sin actividad en el repo.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Dos corridas juntas no se pisan (los endpoints son idempotentes), pero
# tampoco tiene sentido encolarlas.
concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-unpaid-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liberar turnos no pagados
        # --max-time 60: un cold start de Render Free puede tardar ~30-50s.
        # --retry-all-errors: mientras el server despierta puede devolver 502/503.
        # -f: un 401/503 deja el job rojo, que es la señal de que falta el secreto.
        run: >-
          curl -fsS --max-time 60 --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $JOBS_SECRET"
          "$RENDER_BACKEND_URL/internal/jobs/release-unpaid-appointments"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}

  send-appointment-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mandar recordatorios de turno
        run: >-
          curl -fsS --max-time 60 --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $JOBS_SECRET"
          "$RENDER_BACKEND_URL/internal/jobs/send-appointment-reminders"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}

  close-expired-medipass-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cerrar accesos vencidos al MediPass
        run: >-
          curl -fsS --max-time 60 --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $JOBS_SECRET"
          "$RENDER_BACKEND_URL/internal/jobs/close-expired-medipass-sessions"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}

  close-finished-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cerrar turnos terminados
        run: >-
          curl -fsS --max-time 60 --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $JOBS_SECRET"
          "$RENDER_BACKEND_URL/internal/jobs/close-finished-appointments"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}

  send-review-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir reseñas
        run: >-
          curl -fsS --max-time 60 --retry 3 --retry-all-errors
          -X POST -H "Authorization: Bearer $JOBS_SECRET"
          "$RENDER_BACKEND_URL/internal/jobs/send-review-requests"
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
