name: CI

# Calidad del código, alineado a la matriz 3.5.4 del Sprint 0.
# La suite de INTEGRACIÓN vive en integration-tests.yml (ENG-39), que corre en
# PR/merge a release/** y main. La protección de rama exige ambos checks en verde
# antes de mergear, así que juntos forman el "pipeline completo" del doc.
#
#   push a cualquier rama        -> lint + type-check + unit
#   PR (contra cualquier base)   -> lint + type-check + unit + e2e + build
#   push a release/** · main     -> lint + type-check + unit + e2e + build
#
# Los filtros de rama que había acá no matcheaban ninguna rama real: el equipo
# nombra las ramas como las genera Linear (`<usuario>/eng-NN-titulo`), y
# `feature/**` / `bugfix/**` quedaron de las dos ramas previas a esa convención.
# Resultado: el trigger de `push` no se disparaba nunca, y un PR apilado sobre
# otra rama de feature —como ENG-55 sobre ENG-54— no recibía ningún check,
# aunque la protección de rama los exige para mergear.
on:
  push:
    branches:
      - '**'
  pull_request:

# Cancela runs obsoletos del mismo ref: si pusheás dos veces seguidas, el primero
# se descarta en vez de encolarse. Ahorra minutos de runner.
#
# Se agrupa por `github.ref`, que para un `push` es `refs/heads/<rama>` y para un
# `pull_request` es `refs/pull/N/merge`. O sea: una rama con PR abierto corre DOS
# veces por push, y eso queda a propósito.
#
# Unificar los grupos (`head_ref || ref_name`) los haría cancelarse entre sí,
# pero los dos eventos disparan casi a la vez y `cancel-in-progress` mata al que
# arrancó primero, sin determinismo sobre cuál. Si sobrevive el de `push`, queda
# un check verde con el nombre que exige la protección de rama que NO corrió e2e
# ni build —esos steps están condicionados a `event_name == 'pull_request'`— y el
# gate se debilita en silencio. El run de más cuesta ~40s; eso, no.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Unit
    runs-on: ubuntu-latest
    env:
      # Valores dummy: ninguno se conecta a nada en CI.
      #  - DATABASE_URL: prisma.config.ts lo exige para cargar; `prisma generate`
      #    no conecta, solo necesita que exista.
      #  - SUPABASE_*: app.e2e-spec.ts levanta el AppModule real, y
      #    SupabaseService.onModuleInit() hace getOrThrow() de estas dos.
      #    `createClient` no hace llamadas de red al construirse.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint:ci

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests (stack HTTP)
        # Tests de endpoints REST con Supertest. El doc los ubica en el nivel de
        # INTEGRACIÓN (§4.2.2.3), así que corren desde el PR a release en
        # adelante, igual que el build. No necesitan Postgres: auth mockea
        # Supabase y app solo renderiza HTML.
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main'
        run: pnpm run test:e2e

      - name: Build (producción)
        # El doc pone el "build de producción" a partir del PR a release, no en
        # el push a feature/bugfix.
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'release/') || github.ref_name == 'main'
        run: pnpm run build
