name: Integration Tests

# `Integration Tests` es, junto con `CI`, uno de los dos required checks que la
# protección de rama de `main` exige (Sprint 0 §2.6). Por eso su trigger tiene que
# acompañar al de ci.yml: si uno de los dos no corre, el gate queda a medias.
#
# ENG-38 extendió estos triggers para sumar `main` (matriz 3.5.4 del Sprint 0).
# Acá se saca el filtro de `branches` del `pull_request` por el mismo motivo que
# en ci.yml: un PR apilado sobre otra rama de feature —como ENG-55 sobre ENG-54—
# se quedaba sin este check aunque la protección de rama lo exige para mergear.
#
# `types` suma `edited`, que no está en los defaults (`opened`, `synchronize`,
# `reopened`). Sin él, reapuntar la base deja pegado al head SHA el resultado
# calculado contra la base vieja. No es teórico: al reapuntar este mismo PR de
# `release/1.2.0` a `main` volvió a correr `CI` y este workflow no, y el PR quedó
# mostrando un Integration Tests verde que nunca se había corrido contra `main`.
#
# `push` NO se amplía, igual que en ci.yml. Acá el motivo es distinto —este job no
# tiene steps condicionados por evento, así que no habría check runs homónimos con
# distinto alcance—, pero levantar un servicio postgres:15 en cada push a cada
# rama no aporta nada que el run del PR no dé ya.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - 'release/**'
      - 'main'

# Sacar el filtro de `branches` multiplica los runs: cada `synchronize` de
# cualquier PR abre uno nuevo, y cada uno levanta su propio postgres. Sin esto,
# dos pushes seguidos dejan dos suites completas corriendo en paralelo sobre el
# mismo PR. Se agrupa por `github.ref` igual que ci.yml, por la misma razón que
# está documentada allá.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mediconnect
          POSTGRES_PASSWORD: mediconnect
          POSTGRES_DB: mediconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediconnect -d mediconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SKIP_DOCKER: 'true'
      DATABASE_URL: 'postgresql://mediconnect:mediconnect@localhost:5432/mediconnect_test?schema=public'
      # Las exige SupabaseService.onModuleInit() con getOrThrow(): sin ellas el
      # bundle del smoke test no llega a levantar. `createClient` no hace red al
      # construirse, así que valores dummy alcanzan.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # ENG-38: centralizado en .nvmrc para no derivar entre workflows.
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration

      # ENG-95: un build verde no garantiza que el bundle levante. El caso real
      # fue tsconfig.build.json emitiendo a dist/src/, con lo que `node dist/main`
      # no existía y start:prod no arrancaba: lint, tests y build seguían en verde.
      #
      # Este smoke test vive acá y no en ci.yml a propósito: PrismaService
      # .onModuleInit() hace $connect(), y el job de ci.yml no tiene Postgres (sus
      # e2e overridean PrismaService justamente por eso). Contra la DATABASE_URL
      # dummy de ci.yml el bundle muere con P1001 antes de escuchar. Acá hay un
      # Postgres real, y alcanza con que responda: /health no consulta la base.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build (producción)
        run: pnpm run build

      - name: Smoke test (el bundle arranca)
        run: |
          node dist/main &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://localhost:3000/health > /dev/null 2>&1; then
              echo "El bundle levantó y /health respondió 200."
              kill "$SERVER_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::El bundle no respondió en /health tras 30s."
          kill "$SERVER_PID" 2>/dev/null || true
          exit 1
